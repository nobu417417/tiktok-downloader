<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; text-align: center; }
    input { width: 90%; padding: 10px; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
    #status { margin-top: 20px; font-weight: bold; word-break: break-all; }
    #copyBtn { display: none; background-color: #f0f0f0; border: 1px solid #ccc; padding: 5px 12px; font-size: 14px; border-radius: 4px; }
    .version-box { margin-top: 40px; padding-top: 10px; border-top: 1px solid #ddd; font-size: 13px; color: #555; font-weight: bold; }
  </style>
</head>
<body>

  <h2>TikTok 動画ダウンロード</h2>
  <input type="text" id="videoUrl" placeholder="TikTokのURLを貼り付け" />
  <br />
  <button onclick="downloadVideo()">ダウンロード実行</button>

  <div id="status"></div>
  <br />
  <button id="copyBtn" onclick="copyError()">エラーメッセージをコピー</button>

  <div class="version-box">
    更新日時: 2026-09-02 10:20
  </div>

  <script>
    let lastErrorMessage = '';

    // URLからユーザーIDと動画IDを抽出するユーティリティ関数
    function parseUrlInfo(urlStr) {
      let author = '';
      let videoId = '';
      try {
        const u = new URL(urlStr);
        const matchUser = u.pathname.match(/@([^/]+)/);
        if (matchUser) author = matchUser[1];

        const matchVideo = u.pathname.match(/video\/(\d+)/);
        if (matchVideo) videoId = matchVideo[1];
      } catch (e) {}
      return { author, videoId };
    }

    // 動画URLからBlobデータを取得して指定のファイル名で直接ダウンロード
    async function triggerDirectDownload(fileUrl, fileName) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = '動画ファイルをダウンロード中...';

      try {
        const res = await fetch(fileUrl);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const blob = await res.blob();
        
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);

        statusDiv.innerText = 'ダウンロードが完了しました！';
      } catch (e) {
        statusDiv.innerText = '直接保存に失敗したため、別タブで動画を開きます...';
        window.open(fileUrl, '_blank');
      }
    }

    async function downloadVideo() {
      const rawUrl = document.getElementById('videoUrl').value.trim();
      const statusDiv = document.getElementById('status');
      const copyBtn = document.getElementById('copyBtn');

      statusDiv.innerText = '';
      copyBtn.style.display = 'none';
      lastErrorMessage = '';

      if (!rawUrl) {
        statusDiv.innerText = 'URLを入力してください';
        return;
      }

      statusDiv.innerText = '解析中...';

      // URLから予備の情報を取得しておく
      const parsed = parseUrlInfo(rawUrl);

      // 1. TikWM API
      try {
        const formData = new FormData();
        formData.append('url', rawUrl);
        formData.append('hd', 1);

        const res = await fetch('https://www.tikwm.com/api/', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (data.code === 0 && data.data && (data.data.play || data.data.hdplay)) {
          const videoLink = data.data.hdplay || data.data.play;
          
          // APIからユーザーIDと動画IDを取得（取得できない場合はURLからの解析結果を使用）
          const author = (data.data.author && data.data.author.unique_id) || parsed.author || 'user';
          const videoId = data.data.id || parsed.videoId || Date.now();

          // 指定の書式: ユーザーID(動画ID) - TikTok.mp4
          const fileName = `${author}(${videoId}) - TikTok.mp4`;

          await triggerDirectDownload(videoLink, fileName);
          return;
        } else {
          lastErrorMessage = `[TikWM Error] code: ${data.code}, msg: ${data.msg || 'failed'}`;
        }
      } catch (err) {
        lastErrorMessage = `[TikWM Fetch Error] ${err.message}`;
      }

      // 2. Cobalt API (予備サーバー)
      statusDiv.innerText = '予備サーバーで解析中...';
      try {
        let cleanUrl = rawUrl;
        try {
          const urlObj = new URL(rawUrl);
          cleanUrl = urlObj.origin + urlObj.pathname;
        } catch (e) {}

        const response = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: cleanUrl,
            videoQuality: 'max'
          })
        });

        const data2 = await response.json();

        let targetUrl = '';
        if (data2.status === 'stream' || data2.status === 'redirect' || data2.status === 'tunnel') {
          targetUrl = data2.url;
        } else if (data2.status === 'picker' && data2.picker && data2.picker.length > 0) {
          targetUrl = data2.picker[0].url;
        }

        if (targetUrl) {
          const author = parsed.author || 'user';
          const videoId = parsed.videoId || Date.now();
          const fileName = `${author}(${videoId}) - TikTok.mp4`;

          await triggerDirectDownload(targetUrl, fileName);
          return;
        } else {
          lastErrorMessage += ` | [Cobalt Status: ${data2.status || 'unknown'}] ${data2.text || data2.code || JSON.stringify(data2)}`;
        }
      } catch (err2) {
        lastErrorMessage += ` | [Cobalt Fetch Error] ${err2.message}`;
      }

      // 全て失敗した場合
      statusDiv.innerText = 'エラー: 動画を取得できませんでした';
      copyBtn.style.display = 'inline-block';
    }

    function copyError() {
      if (!lastErrorMessage) return;
      navigator.clipboard.writeText(lastErrorMessage).then(() => {
        alert('エラー詳細をクリップボードにコピーしました');
      }).catch(() => {
        alert('コピーに失敗しました:\n' + lastErrorMessage);
      });
    }
  </script>
</body>
</html>
