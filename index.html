<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; text-align: center; }
    input { width: 90%; padding: 10px; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
    #status { margin-top: 20px; font-weight: bold; word-break: break-all; }
    #copyBtn { display: none; background-color: #f0f0f0; border: 1px solid #ccc; padding: 5px 12px; font-size: 14px; border-radius: 4px; }
    .version-box { margin-top: 40px; padding-top: 10px; border-top: 1px solid #ddd; font-size: 13px; color: #555; font-weight: bold; }
  </style>
</head>
<body>

  <h2>TikTok 動画ダウンロード</h2>
  <input type="text" id="videoUrl" placeholder="TikTokのURLを貼り付け" />
  <br />
  <button onclick="downloadVideo()">ダウンロード</button>

  <div id="status"></div>
  <button id="copyBtn" onclick="copyError()">エラーメッセージをコピー</button>

  <!-- バージョン確認用の更新日時 -->
  <div class="version-box">
    更新日時: 2026-09-02 09:55
  </div>

  <script>
    let lastErrorMessage = '';

    async function downloadVideo() {
      const rawUrl = document.getElementById('videoUrl').value.trim();
      const statusDiv = document.getElementById('status');
      const copyBtn = document.getElementById('copyBtn');

      copyBtn.style.display = 'none';
      lastErrorMessage = '';

      if (!rawUrl) {
        statusDiv.innerText = 'URLを入力してください';
        return;
      }

      statusDiv.innerText = '解析中...';

      // 1. Cobalt API で試行
      try {
        let cleanUrl = rawUrl;
        try {
          const urlObj = new URL(rawUrl);
          cleanUrl = urlObj.origin + urlObj.pathname;
        } catch (e) {}

        const response = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: cleanUrl,
            videoQuality: 'max'
          })
        });

        const data = await response.json();

        if (data.status === 'stream' || data.status === 'redirect' || data.status === 'tunnel') {
          statusDiv.innerText = 'ダウンロードを開始します...';
          window.location.href = data.url;
          return;
        } else if (data.status === 'picker' && data.picker && data.picker.length > 0) {
          window.location.href = data.picker[0].url;
          return;
        } else {
          lastErrorMessage = `[Cobalt Status: ${data.status || 'unknown'}] ${data.text || data.code || JSON.stringify(data)}`;
        }
      } catch (err) {
        lastErrorMessage = `[Cobalt Fetch Error] ${err.message}`;
      }

      // 2. 予備API (tikwm) で再試行
      statusDiv.innerText = '予備サーバーで再試行中...';
      try {
        const formData = new FormData();
        formData.append('url', rawUrl);
        formData.append('count', 12);
        formData.append('cursor', 0);
        formData.append('web', 1);

        const res2 = await fetch('https://www.tikwm.com/api/', {
          method: 'POST',
          body: formData
        });

        const data2 = await res2.json();

        if (data2.code === 0 && data2.data && data2.data.play) {
          statusDiv.innerText = 'ダウンロードを開始します...';
          window.location.href = data2.data.play;
          return;
        } else {
          lastErrorMessage += ` | [TikWM Error] code: ${data2.code}, msg: ${data2.msg || 'failed'}`;
        }
      } catch (err2) {
        lastErrorMessage += ` | [TikWM Fetch Error] ${err2.message}`;
      }

      // 全て失敗した場合
      statusDiv.innerText = 'エラー: 動画を取得できませんでした';
      copyBtn.style.display = 'inline-block';
    }

    function copyError() {
      if (!lastErrorMessage) return;
      navigator.clipboard.writeText(lastErrorMessage).then(() => {
        alert('エラー詳細をクリップボードにコピーしました');
      }).catch(() => {
        alert('コピーに失敗しました:\n' + lastErrorMessage);
      });
    }
  </script>
</body>
</html>
