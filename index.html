<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Video Downloader</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; text-align: center; }
    input { width: 80%; padding: 10px; margin-bottom: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>TikTok 動画ダウンロード</h2>
  <input type="text" id="videoUrl" placeholder="TikTokのURLを貼り付け" />
  <br />
  <button onclick="downloadVideo()">ダウンロード</button>

  <div id="status"></div>

  <script>
    async function downloadVideo() {
      const urlInput = document.getElementById('videoUrl').value.trim();
      const statusDiv = document.getElementById('status');

      if (!urlInput) {
        statusDiv.innerText = 'URLを入力してください';
        return;
      }

      statusDiv.innerText = '解析中...';

      try {
        // Cobalt API を呼び出し
        const response = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: urlInput
          })
        });

        const data = await response.json();

        if (data.status === 'stream' || data.status === 'redirect') {
          statusDiv.innerText = 'ダウンロードを開始します...';
          // 動画ファイルを開く（直リンクでダウンロード開始）
          window.location.href = data.url;
        } else {
          statusDiv.innerText = '動画を取得できませんでした: ' + (data.text || 'エラー');
        }
      } catch (error) {
        console.error(error);
        statusDiv.innerText = '通信エラーが発生しました';
      }
    }
  </script>
</body>
</html>
